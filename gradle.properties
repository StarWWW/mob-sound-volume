# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Minecraft version to build for, one of the files in versions/. Another one: gradlew build -Pmc=26.2
mc=26.1.2

# Fabric Properties (https://fabricmc.net/develop)
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod Properties; the jar is named <mod_version>+<minecraft version>
mod_version=1.2.0
group=mobvolume

# Dependencies that are the same for every Minecraft version
junit_version=5.11.4
